# Nginx: authenticity.id / www.authenticity.id → Docker app (127.0.0.1:8003)
# SSL terminates at AWS ALB — this vhost is HTTP only.
#
# Pasang:
#   sudo cp deploy/nginx-authen-proxy.conf /etc/nginx/sites-available/authen.conf
#   sudo ln -sf /etc/nginx/sites-available/authen.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 502 "upstream sent too big header": index.php sends a very large CSP header;
# proxy_buffer_size must be increased (default 4k/8k is too small).

upstream www_authenticity_backend {
    server 127.0.0.1:8003;
    keepalive 16;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name authenticity.id www.authenticity.id;

    access_log /var/log/nginx/authenticity.id.access.log;
    error_log  /var/log/nginx/authenticity.id.error.log warn;

    client_max_body_size 32M;

    location / {
        proxy_pass http://www_authenticity_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Required: CSP + Set-Cookie headers from CodeIgniter exceed default nginx buffers
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;
    }
}
